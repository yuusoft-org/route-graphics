$schema: http://json-schema.org/draft-07/schema#
title: Slider Computed Node
description: Schema for slider computed node after parsing
type: object
required:
  - id
  - type
  - x
  - y
  - originX
  - originY
  - direction
  - thumbSrc
  - barSrc
  - alpha
  - min
  - max
  - step
  - initialValue
properties:
  id:
    type: string
    description: Unique identifier for the slider element
  type:
    const: slider
    description: Element type, must be 'slider'
  x:
    type: number
    description: X position adjusted for anchor point
  y:
    type: number
    description: Y position adjusted for anchor point
  originX:
    type: number
    description: Calculated origin X coordinate based on anchor
  originY:
    type: number
    description: Calculated origin Y coordinate based on anchor
  scaleX:
    type: number
    description: Authored horizontal scale when a live sign transform is required
  scaleY:
    type: number
    description: Authored vertical scale when a live sign transform is required
  rotation:
    type: number
    description: Rotation in degrees
    default: 0
  direction:
    type: string
    enum: [horizontal, vertical]
    description: Direction of the slider movement
  thumbSrc:
    type: string
    description: URL of the thumb sprite
  barSrc:
    type: string
    description: URL of the bar sprite
  inactiveBarSrc:
    type: string
    description: Optional URL of the inactive track sprite rendered beneath `barSrc`
  alpha:
    type: number
    description: Opacity/transparency of the slider (0-1)
    minimum: 0
    maximum: 1
  min:
    type: number
    description: Minimum value of the slider
  max:
    type: number
    description: Maximum value of the slider
  width:
    type: number
    description: Width of the sprite in pixels
  height:
    type: number
    description: Height of the sprite in pixels
  step:
    type: number
    description: Step increment for slider value changes
    minimum: 0
  initialValue:
    type: number
    description: Initial value of the slider
  hover:
    type: object
    description: Configuration for hover behavior
    properties:
      thumbSrc:
        type: string
        description: URL of the thumb sprite when hovered
      barSrc:
        type: string
        description: URL of the bar sprite when hovered
      inactiveBarSrc:
        type: string
        description: URL of the inactive track sprite when hovered
      cursor:
        type: string
        description: CSS cursor style when hovering over the slider
      soundSrc:
        type: string
        description: URL of sound to play when hovering over the slider
      soundVolume:
        type: number
        description: Volume. 0 means muted. 100 means original full volume.
        minimum: 0
        maximum: 100
        default: 100
  change:
    type: object
    description: Configuration for dragging behavior
    properties:
      payload:
        type: object
        description: Payload for drag action event. Typically contains actions like variable updates with "{{ value }}" template for current slider value.
events:
  type: object
  description: Events emitted by this element
  properties:
    change:
      type: object
      description: This event type is called "change" and will be invoked when the slider value changes.
      properties:
        _event:
          type: object
          properties:
            id:
              type: string
              description: The ID of the element that changed
            value:
              type: number
              description: The current value of the slider
