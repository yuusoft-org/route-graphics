$schema: http://json-schema.org/draft-07/schema#
title: Rect Element
description: Schema for rectangle element raw input
type: object
additionalProperties: false
$def:
  point:
    type: object
    additionalProperties: false
    required:
      - x
      - y
    properties:
      x:
        type: number
        description: X coordinate
      y:
        type: number
        description: Y coordinate
  stop:
    type: object
    additionalProperties: false
    required:
      - offset
      - color
    properties:
      offset:
        type: number
        minimum: 0
        maximum: 1
        description: Gradient stop offset from 0 to 1
      color:
        type: string
        description: Gradient stop color
  fill:
    oneOf:
      - type: string
        description: Solid fill color. Use "transparent" for a transparent fill.
      - type: object
        additionalProperties: false
        required:
          - type
          - color
        properties:
          type:
            const: solid
            description: Solid fill type
          color:
            type: string
            description: Solid fill color
      - type: object
        additionalProperties: false
        required:
          - type
          - stops
        properties:
          type:
            const: linear-gradient
            description: Linear gradient fill type
          start:
            "$ref": "#/$def/point"
            description: "Gradient start point. Defaults to { x: 0, y: 0 } in local normalized coordinates."
          end:
            "$ref": "#/$def/point"
            description: "Gradient end point. Defaults to { x: 0, y: 1 } in local normalized coordinates."
          stops:
            type: array
            minItems: 2
            items:
              "$ref": "#/$def/stop"
          coordinateSpace:
            type: string
            enum: [local, global]
            description: Whether gradient coordinates are relative to the rect or the world
          resolution:
            type: number
            exclusiveMinimum: 0
            description: Gradient sampling resolution in pixels
          spread:
            type: string
            enum: [pad, repeat]
            description: Behavior outside the gradient range
      - type: object
        additionalProperties: false
        required:
          - type
          - stops
        properties:
          type:
            const: radial-gradient
            description: Radial gradient fill type
          innerCenter:
            "$ref": "#/$def/point"
            description: "Inner circle center. Defaults to { x: 0.5, y: 0.5 } in local normalized coordinates."
          innerRadius:
            type: number
            description: Inner circle radius. Defaults to 0.
          outerCenter:
            "$ref": "#/$def/point"
            description: Outer circle center. Defaults to the inner center in local normalized coordinates.
          outerRadius:
            type: number
            description: Outer circle radius. Defaults to 0.5.
          stops:
            type: array
            minItems: 2
            items:
              "$ref": "#/$def/stop"
          coordinateSpace:
            type: string
            enum: [local, global]
            description: Whether gradient coordinates are relative to the rect or the world
          resolution:
            type: number
            exclusiveMinimum: 0
            description: Gradient sampling resolution in pixels
          spread:
            type: string
            enum: [pad, repeat]
            description: Behavior outside the gradient range
          scale:
            type: number
            description: Radial gradient ellipse scale
          rotation:
            type: number
            description: Radial gradient rotation in radians
required:
  - id
  - type
  - width
  - height
properties:
  id:
    type: string
    description: Unique identifier for the rect element
  type:
    const: rect
    description: Element type, must be 'rect'
  width:
    type: number
    exclusiveMinimum: 0
    description: Width of the rectangle in pixels
  height:
    type: number
    exclusiveMinimum: 0
    description: Height of the rectangle in pixels
  x:
    type: number
    description: X position of the rectangle
    default: 0
  y:
    type: number
    description: Y position of the rectangle
    default: 0
  anchorX:
    type: number
    description: Horizontal anchor point where 0 is left edge, 1 is right edge (100% width). Values can extend beyond 0-1 range.
  anchorY:
    type: number
    description: Vertical anchor point where 0 is top edge, 1 is bottom edge (100% height). Values can extend beyond 0-1 range.
  originX:
    type: number
    description: Horizontal transform origin in pixels from the element's left edge. Defaults to the anchor-derived X origin.
  originY:
    type: number
    description: Vertical transform origin in pixels from the element's top edge. Defaults to the anchor-derived Y origin.
  scaleX:
    type: number
    description: Horizontal scale. Negative values mirror the rectangle and zero collapses it.
  scaleY:
    type: number
    description: Vertical scale. Negative values mirror the rectangle and zero collapses it.
  alpha:
    type: number
    description: Opacity/transparency of the rectangle (0-1)
    minimum: 0
    maximum: 1
    default: 1
  fill:
    "$ref": "#/$def/fill"
    description: Optional fill of the rectangle. Supports solid colors and structured gradient fills. When omitted, the rect renders transparent.
  border:
    type: object
    additionalProperties: false
    description: Border properties
    properties:
      width:
        type: number
        minimum: 0
        description: Border width in pixels
        default: 0
      color:
        type: string
        description: Border color
        default: black
      alpha:
        type: number
        description: Border opacity (0-1)
        minimum: 0
        maximum: 1
        default: 1
  cornerRadius:
    description: Uniform radius or independent corner radii in pixels
    oneOf:
      - type: number
        minimum: 0
      - type: object
        additionalProperties: false
        properties:
          topLeft:
            type: number
            minimum: 0
          topRight:
            type: number
            minimum: 0
          bottomRight:
            type: number
            minimum: 0
          bottomLeft:
            type: number
            minimum: 0
  rotation:
    type: number
    description: Rotation in degrees
    default: 0
  filters:
    $ref: "../shader-config.yaml#/definitions/elementFilters"
  blur:
    type: object
    additionalProperties: false
    required: [x, y]
    properties:
      x:
        type: number
        minimum: 0
      y:
        type: number
        minimum: 0
      quality:
        type: number
        minimum: 1
        default: 4
      kernelSize:
        type: number
        enum: [5, 7, 9, 11, 13, 15]
        default: 5
      repeatEdgePixels:
        type: boolean
        default: false
  hover:
    type: object
    additionalProperties: false
    properties:
      fill:
        "$ref": "#/$def/fill"
        description: Fill while the rect is hovered
      alpha:
        type: number
        minimum: 0
        maximum: 1
        description: Alpha while the rect is hovered
      soundSrc:
        type: string
        description: source of sound to be played when hovering over the sprite
      soundVolume:
        type: number
        description: Volume. 0 means muted. 100 means original full volume.
        minimum: 0
        maximum: 100
        default: 100
      cursor:
        type: string
        description: CSS cursor style when hovering over the sprite
      payload:
        type: object
        description: Payload for hover action event
  click:
    type: object
    additionalProperties: false
    properties:
      fill:
        "$ref": "#/$def/fill"
        description: Fill while the rect is pressed with the primary pointer
      alpha:
        type: number
        minimum: 0
        maximum: 1
        description: Alpha while the rect is pressed with the primary pointer
      soundSrc:
        type: string
        description: source of sound to be played when the sprite is clicked
      soundVolume:
        type: number
        description: Volume. 0 means muted. 100 means original full volume.
        minimum: 0
        maximum: 100
        default: 100
      payload:
        type: object
        description: Payload for click action event
  drag:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      start:
        type: object
        additionalProperties: false
        properties:
          payload:
            type: object
            description: Payload for drag start event
      end:
        type: object
        additionalProperties: false
        properties:
          payload:
            type: object
            description: Payload for drag end event
      move:
        type: object
        additionalProperties: false
        properties:
          payload:
            type: object
            description: Payload for drag move event
  rightClick:
    type: object
    additionalProperties: false
    properties:
      fill:
        "$ref": "#/$def/fill"
        description: Fill while the rect is pressed with the secondary pointer
      alpha:
        type: number
        minimum: 0
        maximum: 1
        description: Alpha while the rect is pressed with the secondary pointer
      soundSrc:
        type: string
        description: source of sound to be played when the rect is right-clicked
      soundVolume:
        type: number
        minimum: 0
        maximum: 100
        default: 100
      payload:
        type: object
        description: Payload for right-click action event
  scrollUp:
    type: object
    additionalProperties: false
    properties:
      payload:
        type: object
        description: Payload for scroll up action event
  scrollDown:
    type: object
    additionalProperties: false
    properties:
      payload:
        type: object
        description: Payload for scroll down action event
