$schema: http://json-schema.org/draft-07/schema#
title: Sound
description: Schema for sound
type: object
required:
  - id
  - type
  - src
properties:
  id:
    type: string
    description: Unique identifier
  type:
    const: sound
    description: Sound
  src:
    type: string
    description: Source of the sound
  volume:
    type: number
    description: Volume. 0 means muted. 100 means original full volume.
    default: 100
    minimum: 0
    maximum: 100
  muted:
    type: boolean
    description: Whether the sound is muted
    default: false
  pan:
    type: number
    description: Stereo pan. -1 means left. 1 means right.
    default: 0
    minimum: -1
    maximum: 1
  loop:
    type: boolean
    description: Loop
    default: false
  startDelayMs:
    type: number
    description: Delay in milliseconds before playing the sound
    default: 0
    minimum: 0
  playbackRate:
    type: number
    description: Playback speed multiplier
    default: 1
    minimum: 0
  transition:
    $ref: "audio-transition.yaml#/definitions/soundInlineTransition"
    description: Inline lifecycle automation for sound properties
  startAt:
    type: number
    description: Start offset in seconds
    default: 0
    minimum: 0
  endAt:
    type:
      - number
      - "null"
    description: Optional end time in seconds
    default: null
    minimum: 0
  playback:
    type: object
    description: Optional command-controlled playback instruction
    additionalProperties: false
    required:
      - commandId
      - operation
    properties:
      commandId:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        description: Monotonically increasing command identity
      operation:
        type: string
        enum: [play, pause, resume, stop, seek]
        description: Transport operation
      positionMs:
        type: number
        minimum: 0
        description: Segment-relative position required by play and seek
    allOf:
      - if:
          properties:
            operation:
              enum: [play, seek]
          required:
            - operation
        then:
          required:
            - positionMs
      - if:
          properties:
            operation:
              enum: [pause, resume, stop]
          required:
            - operation
        then:
          not:
            required:
              - positionMs
