$schema: http://json-schema.org/draft-07/schema#
title: Animation
description: Schema for Route Graphics animations
type: object
required:
  - id
  - targetId
  - type
$defs:
  keyframe:
    type: object
    required:
      - value
      - duration
    properties:
      value:
        type: number
        description: The target value for this keyframe.
      duration:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        description: Duration to reach this value in milliseconds.
      delay:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        default: 0
        description: Time in milliseconds to hold the previous value before starting this keyframe segment.
      easing:
        type: string
        description: Easing function to use.
        enum:
          - linear
          - easeInQuad
          - easeOutQuad
          - easeInOutQuad
          - easeInCubic
          - easeOutCubic
          - easeInOutCubic
          - easeInQuart
          - easeOutQuart
          - easeInOutQuart
          - easeInQuint
          - easeOutQuint
          - easeInOutQuint
          - easeInSine
          - easeOutSine
          - easeInOutSine
          - easeInExpo
          - easeOutExpo
          - easeInOutExpo
          - easeInCirc
          - easeOutCirc
          - easeInOutCirc
          - easeInBack
          - easeOutBack
          - easeInOutBack
          - easeInBounce
          - easeOutBounce
          - easeInOutBounce
          - easeInElastic
          - easeOutElastic
          - easeInOutElastic
      relative:
        type: boolean
        description: Whether the value is relative to the previous keyframe value.
        default: false
    additionalProperties: false
  tweenProperty:
    oneOf:
      - $ref: "#/$defs/manualTweenProperty"
      - $ref: "#/$defs/autoTweenProperty"
  colorKeyframe:
    type: object
    required:
      - value
      - duration
    properties:
      value:
        type: string
        description: Target color value.
      duration:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      delay:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        default: 0
        description: Time in milliseconds to hold the previous color before starting this keyframe segment.
      easing:
        type: string
        enum:
          - linear
          - easeInQuad
          - easeOutQuad
          - easeInOutQuad
          - easeInCubic
          - easeOutCubic
          - easeInOutCubic
          - easeInQuart
          - easeOutQuart
          - easeInOutQuart
          - easeInQuint
          - easeOutQuint
          - easeInOutQuint
          - easeInSine
          - easeOutSine
          - easeInOutSine
          - easeInExpo
          - easeOutExpo
          - easeInOutExpo
          - easeInCirc
          - easeOutCirc
          - easeInOutCirc
          - easeInBack
          - easeOutBack
          - easeInOutBack
          - easeInBounce
          - easeOutBounce
          - easeInOutBounce
          - easeInElastic
          - easeOutElastic
          - easeInOutElastic
    additionalProperties: false
  manualColorTweenProperty:
    type: object
    required:
      - keyframes
    properties:
      initialValue:
        type: string
      keyframes:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/colorKeyframe"
    additionalProperties: false
  colorTweenProperty:
    oneOf:
      - $ref: "#/$defs/manualColorTweenProperty"
      - $ref: "#/$defs/autoTweenProperty"
  manualTweenProperty:
    type: object
    properties:
      initialValue:
        type: number
        description: Optional initial value before the first keyframe.
      keyframes:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/keyframe"
    required:
      - keyframes
    additionalProperties: false
  autoTweenConfig:
    type: object
    properties:
      duration:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        description: Duration in milliseconds for the generated tween.
      delay:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        default: 0
        description: Time in milliseconds to hold the current value before starting the generated tween.
      easing:
        type: string
        description: Easing function to use.
        enum:
          - linear
          - easeInQuad
          - easeOutQuad
          - easeInOutQuad
          - easeInCubic
          - easeOutCubic
          - easeInOutCubic
          - easeInQuart
          - easeOutQuart
          - easeInOutQuart
          - easeInQuint
          - easeOutQuint
          - easeInOutQuint
          - easeInSine
          - easeOutSine
          - easeInOutSine
          - easeInExpo
          - easeOutExpo
          - easeInOutExpo
          - easeInCirc
          - easeOutCirc
          - easeInOutCirc
          - easeInBack
          - easeOutBack
          - easeInOutBack
          - easeInBounce
          - easeOutBounce
          - easeInOutBounce
          - easeInElastic
          - easeOutElastic
          - easeInOutElastic
    required:
      - duration
    additionalProperties: false
  autoTweenProperty:
    type: object
    properties:
      auto:
        $ref: "#/$defs/autoTweenConfig"
    required:
      - auto
    additionalProperties: false
  filterTweens:
    type: object
    minProperties: 1
    description: Shader parameter timelines grouped by inline filter id.
    patternProperties:
      "^.+$":
        $ref: "../shader-config.yaml#/definitions/shaderTween"
    additionalProperties: false
  rectPointTween:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      x:
        $ref: "#/$defs/tweenProperty"
      y:
        $ref: "#/$defs/tweenProperty"
  rectFillStopTween:
    type: object
    required:
      - index
    minProperties: 2
    additionalProperties: false
    properties:
      index:
        type: integer
        minimum: 0
      offset:
        $ref: "#/$defs/tweenProperty"
      color:
        $ref: "#/$defs/colorTweenProperty"
  rectFillTween:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      color:
        $ref: "#/$defs/colorTweenProperty"
      start:
        $ref: "#/$defs/rectPointTween"
      end:
        $ref: "#/$defs/rectPointTween"
      innerCenter:
        $ref: "#/$defs/rectPointTween"
      innerRadius:
        $ref: "#/$defs/tweenProperty"
      outerCenter:
        $ref: "#/$defs/rectPointTween"
      outerRadius:
        $ref: "#/$defs/tweenProperty"
      stops:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/rectFillStopTween"
      scale:
        $ref: "#/$defs/tweenProperty"
      rotation:
        $ref: "#/$defs/tweenProperty"
  rectBorderTween:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      width:
        $ref: "#/$defs/tweenProperty"
      color:
        $ref: "#/$defs/colorTweenProperty"
      alpha:
        $ref: "#/$defs/tweenProperty"
  rectCornerRadiusTween:
    oneOf:
      - $ref: "#/$defs/tweenProperty"
      - type: object
        minProperties: 1
        additionalProperties: false
        properties:
          topLeft:
            $ref: "#/$defs/tweenProperty"
          topRight:
            $ref: "#/$defs/tweenProperty"
          bottomRight:
            $ref: "#/$defs/tweenProperty"
          bottomLeft:
            $ref: "#/$defs/tweenProperty"
  updateTween:
    type: object
    properties:
      alpha:
        $ref: "#/$defs/tweenProperty"
      x:
        $ref: "#/$defs/tweenProperty"
      y:
        $ref: "#/$defs/tweenProperty"
      translateX:
        $ref: "#/$defs/tweenProperty"
      translateY:
        $ref: "#/$defs/tweenProperty"
      scaleX:
        $ref: "#/$defs/tweenProperty"
      scaleY:
        $ref: "#/$defs/tweenProperty"
      rotation:
        $ref: "#/$defs/tweenProperty"
      blurX:
        $ref: "#/$defs/tweenProperty"
      blurY:
        $ref: "#/$defs/tweenProperty"
      width:
        $ref: "#/$defs/tweenProperty"
      height:
        $ref: "#/$defs/tweenProperty"
      fill:
        $ref: "#/$defs/rectFillTween"
      border:
        $ref: "#/$defs/rectBorderTween"
      cornerRadius:
        $ref: "#/$defs/rectCornerRadiusTween"
      filters:
        $ref: "#/$defs/filterTweens"
    allOf:
      - not:
          required:
            - x
            - translateX
      - not:
          required:
            - y
            - translateY
    additionalProperties: false
    minProperties: 1
  transitionTween:
    type: object
    properties:
      x:
        $ref: "#/$defs/tweenProperty"
      y:
        $ref: "#/$defs/tweenProperty"
      translateX:
        $ref: "#/$defs/tweenProperty"
      translateY:
        $ref: "#/$defs/tweenProperty"
      alpha:
        $ref: "#/$defs/tweenProperty"
      scaleX:
        $ref: "#/$defs/tweenProperty"
      scaleY:
        $ref: "#/$defs/tweenProperty"
      rotation:
        $ref: "#/$defs/tweenProperty"
    allOf:
      - not:
          required:
            - x
            - translateX
      - not:
          required:
            - y
            - translateY
    additionalProperties: false
    minProperties: 1
  transitionSide:
    type: object
    required:
      - tween
    properties:
      tween:
        $ref: "#/$defs/transitionTween"
    additionalProperties: false
  maskProgress:
    $ref: "#/$defs/tweenProperty"
  sequenceMaskFrame:
    type: object
    required:
      - at
      - texture
    properties:
      at:
        type: number
        minimum: 0
        maximum: 1
        description: Normalized progress point where this sequence frame is sampled.
      texture:
        type: string
    additionalProperties: false
  mask:
    type: object
    required:
      - kind
    properties:
      kind:
        type: string
        enum: [single, sequence]
      texture:
        type: string
      frames:
        type: array
        minItems: 2
        items:
          $ref: "#/$defs/sequenceMaskFrame"
      channel:
        type: string
        enum: [red, green, blue, alpha]
      softness:
        type: number
      invert:
        type: boolean
      sample:
        type: string
        enum: [hold, linear]
      delay:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        default: 0
        description: Time in milliseconds before the mask becomes active and its progress timeline begins.
      progress:
        $ref: "#/$defs/maskProgress"
    additionalProperties: false
    allOf:
      - if:
          properties:
            kind:
              const: single
        then:
          required:
            - texture
          not:
            anyOf:
              - required: [frames]
              - required: [sample]
      - if:
          properties:
            kind:
              const: sequence
        then:
          required:
            - frames
          not:
            anyOf:
              - required: [texture]
              - required: [softness]
  gsapEasing:
    oneOf:
      - type: string
      - type: object
        required: [kind]
        properties:
          kind:
            enum: [linear, power, sine, expo, circ, back, bounce, elastic, steps, cubicBezier, sampled]
          direction:
            enum: [in, out, inOut]
          exponent:
            type: integer
            minimum: 1
            maximum: 5
          overshoot:
            type: number
            minimum: 0
          amplitude:
            type: number
            minimum: 1
          period:
            type: number
            exclusiveMinimum: 0
          count:
            type: integer
            minimum: 1
          position:
            enum: [start, end]
          points:
            type: array
            minItems: 4
            maxItems: 4
            items: { type: number }
          samples:
            type: array
            minItems: 2
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number }
        additionalProperties: false
  gsapDefaults:
    type: object
    properties:
      duration: { type: integer, minimum: 0, maximum: 9007199254740991 }
      easing: { $ref: "#/$defs/gsapEasing" }
      overwrite: { enum: [auto, all, none, error] }
      repeat:
        oneOf:
          - { type: integer, minimum: 0, maximum: 9007199254740991 }
          - { const: infinite }
      repeatDelay: { type: integer, minimum: 0, maximum: 9007199254740991 }
      yoyo: { type: boolean }
      repeatRefresh: { type: boolean }
    additionalProperties: false
  gsapTarget:
    type: object
    oneOf:
      - required: [element]
        properties: { element: { type: string, minLength: 1 } }
        additionalProperties: false
      - required: [elements]
        properties:
          elements:
            type: array
            minItems: 1
            uniqueItems: true
            items: { type: string, minLength: 1 }
        additionalProperties: false
      - required: [textUnits]
        properties:
          textUnits:
            type: object
            required: [elementId, unit]
            properties:
              elementId: { type: string, minLength: 1 }
              unit: { enum: [grapheme, word, line] }
              order: { enum: [logical, visual], default: logical }
              allowEmpty: { type: boolean, default: false }
            additionalProperties: false
        additionalProperties: false
      - required: [transitionSurface]
        properties: { transitionSurface: { enum: [prev, next] } }
        additionalProperties: false
      - required: [transitionMask]
        properties:
          transitionMask:
            oneOf:
              - { const: true }
              - { type: integer, minimum: 0, maximum: 9007199254740991 }
        additionalProperties: false
      - required: [transitionCompositor]
        properties: { transitionCompositor: { const: true } }
        additionalProperties: false
  gsapStart:
    type: object
    oneOf:
      - required: [time]
        properties:
          time: { type: integer, minimum: 0, maximum: 9007199254740991 }
        additionalProperties: false
      - required: [anchor]
        properties:
          anchor: { type: string, minLength: 1 }
          edge: { enum: [start, end] }
          offset: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        additionalProperties: false
  gsapStagger:
    type: object
    properties:
      each: { type: integer, minimum: 0, maximum: 9007199254740991 }
      amount: { type: integer, minimum: 0, maximum: 9007199254740991 }
      from:
        oneOf:
          - { enum: [start, center, end, edges, random] }
          - { type: integer, minimum: 0 }
      easing: { $ref: "#/$defs/gsapEasing" }
      grid:
        type: object
        required: [columns]
        properties:
          columns: { type: integer, minimum: 1 }
        additionalProperties: false
      axis: { enum: [x, y] }
    oneOf:
      - required: [each]
        not: { required: [amount] }
      - required: [amount]
        not: { required: [each] }
    additionalProperties: false
  gsapFrame:
    type: object
    required: [values, duration]
    properties:
      values: { type: object, minProperties: 1 }
      duration: { type: integer, minimum: 0, maximum: 9007199254740991 }
      delay: { type: integer, minimum: 0, maximum: 9007199254740991 }
      easing: { $ref: "#/$defs/gsapEasing" }
    additionalProperties: false
  gsapModifier:
    oneOf:
      - type: object
        required: [kind]
        properties:
          kind: { const: snap }
          increment: { type: number, exclusiveMinimum: 0 }
          values:
            type: array
            minItems: 1
            items: { type: number }
        oneOf:
          - required: [increment]
            not: { required: [values] }
          - required: [values]
            not: { required: [increment] }
        additionalProperties: false
      - type: object
        required: [kind, precision]
        properties:
          kind: { const: round }
          precision: { type: integer, minimum: 0, maximum: 15 }
        additionalProperties: false
      - type: object
        required: [kind, min, max]
        properties:
          kind: { enum: [clamp, wrap, wrapYoyo] }
          min: { type: number }
          max: { type: number }
        additionalProperties: false
  gsapModifiers:
    type: object
    minProperties: 1
    additionalProperties:
      type: array
      minItems: 1
      items: { $ref: "#/$defs/gsapModifier" }
  gsapStep:
    type: object
    required: [kind]
    properties:
      kind: { enum: [set, to, from, fromTo, keyframes, sequence, parallel, wait, mark, emit] }
      id: { type: string, minLength: 1 }
      delay: { type: integer, minimum: 0, maximum: 9007199254740991 }
      overlap: { type: integer, minimum: 0, maximum: 9007199254740991 }
      start: { $ref: "#/$defs/gsapStart" }
      targets:
        oneOf:
          - { type: string, minLength: 1 }
          - type: array
            minItems: 1
            uniqueItems: true
            items: { type: string, minLength: 1 }
      values: { type: object, minProperties: 1 }
      from: { type: object, minProperties: 1 }
      to: { type: object, minProperties: 1 }
      duration: { type: integer, minimum: 0, maximum: 9007199254740991 }
      easing: { $ref: "#/$defs/gsapEasing" }
      stagger: { $ref: "#/$defs/gsapStagger" }
      overwrite: { enum: [auto, all, none, error] }
      modifiers: { $ref: "#/$defs/gsapModifiers" }
      repeat:
        oneOf:
          - { type: integer, minimum: 0, maximum: 9007199254740991 }
          - { const: infinite }
      repeatDelay: { type: integer, minimum: 0, maximum: 9007199254740991 }
      yoyo: { type: boolean }
      repeatRefresh: { type: boolean }
      speed: { type: number, exclusiveMinimum: 0 }
      frames:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/gsapFrame" }
      steps:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/gsapStep" }
      defaults: { $ref: "#/$defs/gsapDefaults" }
      name: { type: string, minLength: 1 }
      event: { type: string, minLength: 1 }
      payload: {}
      direction: { enum: [forward, reverse, both] }
      occurrence: { enum: [once, eachIteration] }
      seekPolicy: { enum: [suppress, crossed] }
    additionalProperties: false
    allOf:
      - if: { properties: { kind: { const: set } }, required: [kind] }
        then:
          required: [values]
          not:
            anyOf:
              - required: [from]
              - required: [to]
              - required: [frames]
              - required: [steps]
              - required: [duration]
              - required: [easing]
              - required: [repeat]
              - required: [repeatDelay]
              - required: [yoyo]
              - required: [repeatRefresh]
              - required: [speed]
              - required: [name]
              - required: [event]
      - if:
          properties: { kind: { enum: [to, from] } }
          required: [kind]
        then:
          required: [values]
          not:
            anyOf:
              - required: [from]
              - required: [to]
              - required: [frames]
              - required: [steps]
              - required: [name]
              - required: [event]
      - if: { properties: { kind: { const: fromTo } }, required: [kind] }
        then:
          required: [from, to]
          not:
            anyOf:
              - required: [values]
              - required: [frames]
              - required: [steps]
              - required: [name]
              - required: [event]
      - if: { properties: { kind: { const: keyframes } }, required: [kind] }
        then:
          required: [frames]
          not:
            anyOf:
              - required: [values]
              - required: [from]
              - required: [to]
              - required: [steps]
              - required: [duration]
              - required: [name]
              - required: [event]
      - if:
          properties: { kind: { enum: [sequence, parallel] } }
          required: [kind]
        then:
          required: [steps]
          not:
            anyOf:
              - required: [targets]
              - required: [values]
              - required: [from]
              - required: [to]
              - required: [frames]
              - required: [duration]
              - required: [easing]
              - required: [stagger]
              - required: [overwrite]
              - required: [modifiers]
              - required: [name]
              - required: [event]
      - if: { properties: { kind: { const: wait } }, required: [kind] }
        then:
          required: [duration]
          not:
            anyOf:
              - required: [targets]
              - required: [values]
              - required: [from]
              - required: [to]
              - required: [frames]
              - required: [steps]
              - required: [easing]
              - required: [stagger]
              - required: [overwrite]
              - required: [modifiers]
              - required: [repeat]
              - required: [repeatDelay]
              - required: [yoyo]
              - required: [repeatRefresh]
              - required: [speed]
              - required: [name]
              - required: [event]
      - if: { properties: { kind: { const: mark } }, required: [kind] }
        then:
          required: [name]
          not:
            anyOf:
              - required: [targets]
              - required: [values]
              - required: [from]
              - required: [to]
              - required: [frames]
              - required: [steps]
              - required: [duration]
              - required: [easing]
              - required: [stagger]
              - required: [overwrite]
              - required: [modifiers]
              - required: [repeat]
              - required: [repeatDelay]
              - required: [yoyo]
              - required: [repeatRefresh]
              - required: [speed]
              - required: [event]
      - if: { properties: { kind: { const: emit } }, required: [kind] }
        then:
          required: [event]
          not:
            anyOf:
              - required: [targets]
              - required: [values]
              - required: [from]
              - required: [to]
              - required: [frames]
              - required: [steps]
              - required: [duration]
              - required: [easing]
              - required: [stagger]
              - required: [overwrite]
              - required: [modifiers]
              - required: [repeat]
              - required: [repeatDelay]
              - required: [yoyo]
              - required: [repeatRefresh]
              - required: [speed]
              - required: [name]
  gsap:
    type: object
    required: [profile, steps]
    properties:
      profile: { const: portable-v1 }
      defaults: { $ref: "#/$defs/gsapDefaults" }
      targets:
        type: object
        additionalProperties: { $ref: "#/$defs/gsapTarget" }
      steps:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/gsapStep" }
    additionalProperties: false
  playback:
    type: object
    properties:
      continuity:
        type: string
        enum: [render, persistent]
        default: render
      speed:
        type: number
        exclusiveMinimum: 0
        description: Playback speed multiplier. 1 is authored speed, 2 is twice as fast, 0.5 is half speed.
      loop:
        type: boolean
        default: false
        description: Repeat an update animation indefinitely without blocking render completion. Not supported for transitions.
      repeat:
        oneOf:
          - type: integer
            minimum: 0
            maximum: 9007199254740991
          - const: infinite
        default: 0
        description: Additional iterations after the first. Infinite repetition is update-only.
      repeatDelay:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        default: 0
        description: Hold time in milliseconds between iterations.
      yoyo:
        type: boolean
        default: false
        description: Alternate playback direction on repeated iterations.
    additionalProperties: false
    allOf:
      - not:
          required: [loop, repeat]
properties:
  id:
    type: string
    description: Unique identifier for this animation.
  targetId:
    type: string
    description: Element id this animation applies to.
  type:
    type: string
    enum: [update, transition]
    description: Animation structure.
  complete:
    type: object
    description: Reserved per-animation completion configuration. The runtime currently emits only the global renderComplete lifecycle event.
    properties:
      payload:
        type: object
    additionalProperties: true
  playback:
    $ref: "#/$defs/playback"
  tween:
    $ref: "#/$defs/updateTween"
  gsap:
    $ref: "#/$defs/gsap"
  prev:
    $ref: "#/$defs/transitionSide"
  next:
    $ref: "#/$defs/transitionSide"
  mask:
    oneOf:
      - $ref: "#/$defs/mask"
      - type: array
        minItems: 1
        items:
          $ref: "#/$defs/mask"
  compositor:
    $ref: "../shader-config.yaml#/definitions/compositor"
additionalProperties: false
allOf:
  - if:
      properties:
        type:
          const: update
    then:
      oneOf:
        - required: [tween]
          not: { required: [gsap] }
        - required: [gsap]
          not: { required: [tween] }
      not:
        anyOf:
          - required: [prev]
          - required: [next]
