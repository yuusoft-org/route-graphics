$schema: http://json-schema.org/draft-07/schema#
title: Animation
description: Schema for Route Graphics animations
type: object
required:
  - id
  - targetId
  - type
$defs:
  keyframe:
    type: object
    required:
      - value
      - duration
    properties:
      value:
        type: number
        description: The target value for this keyframe.
      duration:
        type: number
        description: Duration to reach this value in milliseconds.
      delay:
        type: number
        minimum: 0
        default: 0
        description: Time in milliseconds to hold the previous value before starting this keyframe segment.
      easing:
        type: string
        description: Easing function to use.
        enum:
          - linear
          - easeInQuad
          - easeOutQuad
          - easeInOutQuad
          - easeInCubic
          - easeOutCubic
          - easeInOutCubic
          - easeInQuart
          - easeOutQuart
          - easeInOutQuart
          - easeInQuint
          - easeOutQuint
          - easeInOutQuint
          - easeInSine
          - easeOutSine
          - easeInOutSine
          - easeInExpo
          - easeOutExpo
          - easeInOutExpo
          - easeInCirc
          - easeOutCirc
          - easeInOutCirc
          - easeInBack
          - easeOutBack
          - easeInOutBack
          - easeInBounce
          - easeOutBounce
          - easeInOutBounce
          - easeInElastic
          - easeOutElastic
          - easeInOutElastic
      relative:
        type: boolean
        description: Whether the value is relative to the previous keyframe value.
        default: false
    additionalProperties: false
  tweenProperty:
    oneOf:
      - $ref: "#/$defs/manualTweenProperty"
      - $ref: "#/$defs/autoTweenProperty"
  colorKeyframe:
    type: object
    required:
      - value
      - duration
    properties:
      value:
        type: string
        description: Target color value.
      duration:
        type: number
      delay:
        type: number
        minimum: 0
        default: 0
        description: Time in milliseconds to hold the previous color before starting this keyframe segment.
      easing:
        type: string
        enum:
          - linear
          - easeInQuad
          - easeOutQuad
          - easeInOutQuad
          - easeInCubic
          - easeOutCubic
          - easeInOutCubic
          - easeInQuart
          - easeOutQuart
          - easeInOutQuart
          - easeInQuint
          - easeOutQuint
          - easeInOutQuint
          - easeInSine
          - easeOutSine
          - easeInOutSine
          - easeInExpo
          - easeOutExpo
          - easeInOutExpo
          - easeInCirc
          - easeOutCirc
          - easeInOutCirc
          - easeInBack
          - easeOutBack
          - easeInOutBack
          - easeInBounce
          - easeOutBounce
          - easeInOutBounce
          - easeInElastic
          - easeOutElastic
          - easeInOutElastic
    additionalProperties: false
  manualColorTweenProperty:
    type: object
    required:
      - keyframes
    properties:
      initialValue:
        type: string
      keyframes:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/colorKeyframe"
    additionalProperties: false
  colorTweenProperty:
    oneOf:
      - $ref: "#/$defs/manualColorTweenProperty"
      - $ref: "#/$defs/autoTweenProperty"
  manualTweenProperty:
    type: object
    properties:
      initialValue:
        type: number
        description: Optional initial value before the first keyframe.
      keyframes:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/keyframe"
    required:
      - keyframes
    additionalProperties: false
  autoTweenConfig:
    type: object
    properties:
      duration:
        type: number
        description: Duration in milliseconds for the generated tween.
      delay:
        type: number
        minimum: 0
        default: 0
        description: Time in milliseconds to hold the current value before starting the generated tween.
      easing:
        type: string
        description: Easing function to use.
        enum:
          - linear
          - easeInQuad
          - easeOutQuad
          - easeInOutQuad
          - easeInCubic
          - easeOutCubic
          - easeInOutCubic
          - easeInQuart
          - easeOutQuart
          - easeInOutQuart
          - easeInQuint
          - easeOutQuint
          - easeInOutQuint
          - easeInSine
          - easeOutSine
          - easeInOutSine
          - easeInExpo
          - easeOutExpo
          - easeInOutExpo
          - easeInCirc
          - easeOutCirc
          - easeInOutCirc
          - easeInBack
          - easeOutBack
          - easeInOutBack
          - easeInBounce
          - easeOutBounce
          - easeInOutBounce
          - easeInElastic
          - easeOutElastic
          - easeInOutElastic
    required:
      - duration
    additionalProperties: false
  autoTweenProperty:
    type: object
    properties:
      auto:
        $ref: "#/$defs/autoTweenConfig"
    required:
      - auto
    additionalProperties: false
  filterTweens:
    type: object
    minProperties: 1
    description: Shader parameter timelines grouped by inline filter id.
    patternProperties:
      "^.+$":
        $ref: "../shader-config.yaml#/definitions/shaderTween"
    additionalProperties: false
  rectPointTween:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      x:
        $ref: "#/$defs/tweenProperty"
      y:
        $ref: "#/$defs/tweenProperty"
  rectFillStopTween:
    type: object
    required:
      - index
    minProperties: 2
    additionalProperties: false
    properties:
      index:
        type: integer
        minimum: 0
      offset:
        $ref: "#/$defs/tweenProperty"
      color:
        $ref: "#/$defs/colorTweenProperty"
  rectFillTween:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      color:
        $ref: "#/$defs/colorTweenProperty"
      start:
        $ref: "#/$defs/rectPointTween"
      end:
        $ref: "#/$defs/rectPointTween"
      innerCenter:
        $ref: "#/$defs/rectPointTween"
      innerRadius:
        $ref: "#/$defs/tweenProperty"
      outerCenter:
        $ref: "#/$defs/rectPointTween"
      outerRadius:
        $ref: "#/$defs/tweenProperty"
      stops:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/rectFillStopTween"
      scale:
        $ref: "#/$defs/tweenProperty"
      rotation:
        $ref: "#/$defs/tweenProperty"
  rectBorderTween:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      width:
        $ref: "#/$defs/tweenProperty"
      color:
        $ref: "#/$defs/colorTweenProperty"
      alpha:
        $ref: "#/$defs/tweenProperty"
  rectCornerRadiusTween:
    oneOf:
      - $ref: "#/$defs/tweenProperty"
      - type: object
        minProperties: 1
        additionalProperties: false
        properties:
          topLeft:
            $ref: "#/$defs/tweenProperty"
          topRight:
            $ref: "#/$defs/tweenProperty"
          bottomRight:
            $ref: "#/$defs/tweenProperty"
          bottomLeft:
            $ref: "#/$defs/tweenProperty"
  updateTween:
    type: object
    properties:
      alpha:
        $ref: "#/$defs/tweenProperty"
      x:
        $ref: "#/$defs/tweenProperty"
      y:
        $ref: "#/$defs/tweenProperty"
      translateX:
        $ref: "#/$defs/tweenProperty"
      translateY:
        $ref: "#/$defs/tweenProperty"
      scaleX:
        $ref: "#/$defs/tweenProperty"
      scaleY:
        $ref: "#/$defs/tweenProperty"
      rotation:
        $ref: "#/$defs/tweenProperty"
      blurX:
        $ref: "#/$defs/tweenProperty"
      blurY:
        $ref: "#/$defs/tweenProperty"
      width:
        $ref: "#/$defs/tweenProperty"
      height:
        $ref: "#/$defs/tweenProperty"
      fill:
        $ref: "#/$defs/rectFillTween"
      border:
        $ref: "#/$defs/rectBorderTween"
      cornerRadius:
        $ref: "#/$defs/rectCornerRadiusTween"
      filters:
        $ref: "#/$defs/filterTweens"
    allOf:
      - not:
          required:
            - x
            - translateX
      - not:
          required:
            - y
            - translateY
    additionalProperties: false
    minProperties: 1
  transitionTween:
    type: object
    properties:
      x:
        $ref: "#/$defs/tweenProperty"
      y:
        $ref: "#/$defs/tweenProperty"
      translateX:
        $ref: "#/$defs/tweenProperty"
      translateY:
        $ref: "#/$defs/tweenProperty"
      alpha:
        $ref: "#/$defs/tweenProperty"
      scaleX:
        $ref: "#/$defs/tweenProperty"
      scaleY:
        $ref: "#/$defs/tweenProperty"
      rotation:
        $ref: "#/$defs/tweenProperty"
    allOf:
      - not:
          required:
            - x
            - translateX
      - not:
          required:
            - y
            - translateY
    additionalProperties: false
    minProperties: 1
  transitionSide:
    type: object
    required:
      - tween
    properties:
      tween:
        $ref: "#/$defs/transitionTween"
    additionalProperties: false
  maskProgress:
    $ref: "#/$defs/tweenProperty"
  sequenceMaskFrame:
    type: object
    required:
      - at
      - texture
    properties:
      at:
        type: number
        minimum: 0
        maximum: 1
        description: Normalized progress point where this sequence frame is sampled.
      texture:
        type: string
    additionalProperties: false
  mask:
    type: object
    required:
      - kind
    properties:
      kind:
        type: string
        enum: [single, sequence]
      texture:
        type: string
      frames:
        type: array
        minItems: 2
        items:
          $ref: "#/$defs/sequenceMaskFrame"
      channel:
        type: string
        enum: [red, green, blue, alpha]
      softness:
        type: number
      invert:
        type: boolean
      sample:
        type: string
        enum: [hold, linear]
      progress:
        $ref: "#/$defs/maskProgress"
    additionalProperties: false
    allOf:
      - if:
          properties:
            kind:
              const: single
        then:
          required:
            - texture
          not:
            anyOf:
              - required: [frames]
              - required: [sample]
      - if:
          properties:
            kind:
              const: sequence
        then:
          required:
            - frames
          not:
            anyOf:
              - required: [texture]
              - required: [softness]
  playback:
    type: object
    properties:
      continuity:
        type: string
        enum: [render, persistent]
        default: render
      speed:
        type: number
        exclusiveMinimum: 0
        description: Playback speed multiplier. 1 is authored speed, 2 is twice as fast, 0.5 is half speed.
      loop:
        type: boolean
        default: false
        description: Repeat an update animation indefinitely without blocking render completion. Not supported for transitions.
    additionalProperties: false
properties:
  id:
    type: string
    description: Unique identifier for this animation.
  targetId:
    type: string
    description: Element id this animation applies to.
  type:
    type: string
    enum: [update, transition]
    description: Animation structure.
  complete:
    type: object
    description: Reserved per-animation completion configuration. The runtime currently emits only the global renderComplete lifecycle event.
    properties:
      payload:
        type: object
    additionalProperties: true
  playback:
    $ref: "#/$defs/playback"
  tween:
    $ref: "#/$defs/updateTween"
  prev:
    $ref: "#/$defs/transitionSide"
  next:
    $ref: "#/$defs/transitionSide"
  mask:
    $ref: "#/$defs/mask"
  compositor:
    $ref: "../shader-config.yaml#/definitions/compositor"
additionalProperties: false
allOf:
  - if:
      properties:
        type:
          const: update
    then:
      required: [tween]
      not:
        anyOf:
          - required: [prev]
          - required: [next]
          - required: [mask]
          - required: [compositor]
  - if:
      properties:
        type:
          const: transition
    then:
      anyOf:
        - required: [prev]
        - required: [next]
        - required: [mask]
        - required: [compositor]
      not:
        required: [tween]
  - if:
      required: [playback]
      properties:
        playback:
          required: [loop]
          properties:
            loop:
              const: true
    then:
      properties:
        type:
          const: update
      not:
        required: [complete]
