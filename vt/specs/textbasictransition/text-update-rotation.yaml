---
title: Text Update Rotation
description: Fixed-width text sampled while rotating around its anchor-derived center.
specs:
  - text rotation should animate from 0 to 90 degrees
  - glyph layout should remain stable during the tween
  - auto rotation tween values should use degrees
steps:
  - action: keypress
    key: "n"
  - action: customEvent
    name: "snapShotKeyFrame"
    detail:
      deltaMS: 500
  - action: screenshot
  - action: customEvent
    name: "snapShotKeyFrame"
    detail:
      deltaMS: 500
  - action: screenshot
---
states:
  - elements:
      - id: rotating-text
        type: text
        content: Rotating text layout
        x: 640
        "y": 360
        width: 320
        anchorX: 0.5
        anchorY: 0.5
        rotation: 0
        textStyle:
          fontSize: 30
          fill: "#FFFFFF"
          fontFamily: Arial
      - id: text-origin-marker
        type: rect
        x: 640
        "y": 360
        width: 10
        height: 10
        anchorX: 0.5
        anchorY: 0.5
        fill: "#FF3355"
  - elements:
      - id: rotating-text
        type: text
        content: Rotating text layout
        x: 640
        "y": 360
        width: 320
        anchorX: 0.5
        anchorY: 0.5
        rotation: 90
        textStyle:
          fontSize: 30
          fill: "#FFFFFF"
          fontFamily: Arial
      - id: text-origin-marker
        type: rect
        x: 640
        "y": 360
        width: 10
        height: 10
        anchorX: 0.5
        anchorY: 0.5
        fill: "#FF3355"
    animations:
      - id: text-rotate
        targetId: rotating-text
        type: update
        tween:
          rotation:
            auto:
              duration: 1000
              easing: linear
