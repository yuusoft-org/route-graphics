<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        color: #f2f4f8;
        font-family: "Noto Sans", sans-serif;
        background: #999 !important;
      }

      body {
        height: auto !important;
        padding-bottom: 20px;
      }

      .vt-state-pager {
        position: relative;
        z-index: 10;
        width: fit-content;
        align-self: flex-start;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        max-width: calc(100vw - 40px);
        margin: 20px 0 0 20px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        background:
          linear-gradient(
            180deg,
            rgba(24, 28, 33, 0.92),
            rgba(11, 14, 18, 0.92)
          ),
          rgba(8, 10, 12, 0.92);
        backdrop-filter: blur(10px);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      }

      .vt-state-pager[hidden] {
        display: none;
      }

      .vt-state-nav {
        appearance: none;
        border: 0;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(242, 244, 248, 0.96);
        min-width: 42px;
        height: 36px;
        padding: 0 12px;
        font-size: 16px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
        transition:
          background 120ms ease,
          color 120ms ease,
          transform 120ms ease,
          opacity 120ms ease;
      }

      .vt-state-nav:hover:not(:disabled),
      .vt-state-index:hover {
        background: rgba(255, 255, 255, 0.14);
        transform: translateY(-1px);
      }

      .vt-state-nav:not(:disabled) {
        background: rgba(255, 255, 255, 0.14);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }

      .vt-state-nav:disabled {
        color: rgba(242, 244, 248, 0.62);
        background: rgba(255, 255, 255, 0.08);
        opacity: 0.7;
        cursor: not-allowed;
      }

      .vt-state-center {
        min-width: 0;
        flex: 0 1 auto;
        display: flex;
        align-items: center;
      }

      .vt-state-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: 8px;
        max-width: min(100%, 70vw);
      }

      .vt-state-index {
        appearance: none;
        min-width: 36px;
        height: 36px;
        padding: 0 12px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        color: rgba(242, 244, 248, 0.88);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        transition:
          background 120ms ease,
          border-color 120ms ease,
          color 120ms ease,
          transform 120ms ease;
      }

      .vt-state-index.is-active {
        background: #f2f4f8;
        border-color: #f2f4f8;
        color: #111418;
        font-weight: 700;
      }

      @media (max-width: 900px) {
        body {
          padding-bottom: 12px;
        }

        .vt-state-pager {
          max-width: calc(100vw - 24px);
          margin: 12px 0 0 12px;
          padding: 10px 12px;
        }

        .vt-state-nav {
          min-width: 36px;
          height: 36px;
        }

        .vt-state-index {
          min-width: 32px;
          height: 32px;
          padding: 0 10px;
        }
      }
    </style>
    <script id="vt-state" type="text/plain">
      {{ content }}
    </script>

      import { parseAllDocuments } from "https://cdn.jsdelivr.net/npm/yaml@2.7.1/+esm";

        },
        "fighter-spritesheet": {

        },
        "mask-diagonal": {

        },
        "mask-left-band": {

        },
        "mask-empty": {

        },
        "mask-full": {

        },
        "mask-center-band": {

        },

          type: "image/png",
        },
        "mask-clockwipe": {
          url: "/public/mask_clockwipe.png",
          type: "image/png",
        },
        "sfx-1": { url: "/public/sfx-1.mp3", type: "audio/mpeg" },
        "sfx-2": { url: "/public/sfx-2.wav", type: "audio/wav" },
        "sfx-ogg-vorbis": {
          url: "/public/sfx-ogg-vorbis.ogg",
          type: "audio/ogg",
        },
        "message-display1": {
          url: "/public/message-display1.mp3?v=2",
          type: "audio/mpeg",
        },
        "bgm-1": { url: "/public/bgm-1.mp3", type: "audio/mpeg" },
        "bgm-2": { url: "/public/bgm-2.mp3", type: "audio/mpeg" },
        "bgm-3": { url: "/public/bgm-3.mp3", type: "audio/mpeg" },
        "bgm-1-ogg": { url: "/public/bgm-1.ogg", type: "audio/ogg" },
        "bgm-2-ogg": { url: "/public/bgm-2.ogg", type: "audio/ogg" },
        "bgm-3-ogg": { url: "/public/bgm-3.ogg", type: "audio/ogg" },
        "mr-de-haviland": {
          url: "/public/mr-de-haviland.ttf",
          type: "font/ttf",
        },
      };

      const isVtDebug =
        window?.RTGL_VT_DEBUG === true || window?.RTGL_VT_DEBUG === "true";
      const isVideoVisualTest =
        isVtDebug && window.location.pathname.includes("/video/");
      const shouldLoadOptionalVideo =
        isVideoVisualTest ||
        (!isVtDebug &&
          (window?.RTGL_VT_INCLUDE_MEDIA === true ||
            new URLSearchParams(window.location.search).get("media") === "1"));

      // Load video for its dedicated VT section while keeping it opt-in on
      // unrelated debug pages and manual browser runs.
      if (shouldLoadOptionalVideo) {
        Object.assign(assetsObject, {
          "video-sample": {
            url: "/public/video_sample.mp4",
            type: "video/mp4",
          },
          "video-sample-2": {
            url: "/public/video_sample_2.mp4",
            type: "video/mp4",
          },
        });
      }

      const assetBufferManager = createAssetBufferManager();
      await assetBufferManager.load(assetsObject);

      const app = createRouteGraphics();
      window.__VT_ROUTE_GRAPHICS__ = app;

      // Deterministic VT-only plugins for exercising asynchronous same-id
      // replacements. A custom event releases the first delete for each ID,
      // which lets specs supersede renders without relying on timer races.
      const vtDeferredRectAdds = new Map();
      const vtDeferredRectDeletes = new Map();
      const vtReleasedDeferredRectAddIds = new Set();
      const vtReleasedDeferredRectDeleteIds = new Set();
      const vtPluginDispatchMismatches = [];

      const findDirectChild = (parent, id) =>
        parent.children.find(
          (child) => !child.destroyed && child.label === id,
        ) ?? null;

      const assertVtPluginOwnsChild = (parent, element, expectedType) => {
        const child = findDirectChild(parent, element.id);
        if (!child || child.__vtElementPluginType === expectedType) {
          return;
        }

        const mismatch = {
          id: element.id,
          expectedType,
          actualType: child.__vtElementPluginType ?? null,
        };
        vtPluginDispatchMismatches.push(mismatch);
        throw new Error(
          `VT plugin ${expectedType} received ${element.id} mounted by ${mismatch.actualType}.`,
        );
      };

      const markVtRectType = (parent, element, type) => {
        const child = findDirectChild(parent, element.id);
        if (child) {
          child.__vtElementPluginType = type;
        }
      };

      const createVtRectPlugin = ({
        type,
        deferFirstAdd = false,
        deferFirstDelete = false,
      }) => ({
        type,
        parse: (options) => ({
          ...rectPlugin.parse({
            ...options,
            state: { ...options.state, type: "rect" },
          }),
          type,
        }),
        add: (options) => {
          if (
            deferFirstAdd &&
            !vtReleasedDeferredRectAddIds.has(options.element.id)
          ) {
            const existing = vtDeferredRectAdds.get(options.element.id);
            if (existing) {
              return existing.promise;
            }

            let resolve;
            let reject;
            const promise = new Promise((resolvePromise, rejectPromise) => {
              resolve = resolvePromise;
              reject = rejectPromise;
            });
            vtDeferredRectAdds.set(options.element.id, {
              options,
              promise,
              reject,
              resolve,
            });
            return promise;
          }

          const operation = rectPlugin.add(options);
          markVtRectType(options.parent, options.element, type);
          return operation;
        },
        update: (options) => {
          assertVtPluginOwnsChild(options.parent, options.prevElement, type);
          const operation = rectPlugin.update(options);
          markVtRectType(options.parent, options.nextElement, type);
          return operation;
        },
        delete: (options) => {
          assertVtPluginOwnsChild(options.parent, options.element, type);

          if (
            !deferFirstDelete ||
            vtReleasedDeferredRectDeleteIds.has(options.element.id)
          ) {
            return rectPlugin.delete(options);
          }

          const existing = vtDeferredRectDeletes.get(options.element.id);
          if (existing) {
            return existing.promise;
          }

          let resolve;
          let reject;
          const promise = new Promise((resolvePromise, rejectPromise) => {
            resolve = resolvePromise;
            reject = rejectPromise;
          });
          vtDeferredRectDeletes.set(options.element.id, {
            options,
            promise,
            reject,
            resolve,
          });
          return promise;
        },
        shouldUpdateUnchanged: rectPlugin.shouldUpdateUnchanged,
      });

      const vtDeferredRectPlugin = createVtRectPlugin({
        type: "vt-deferred-rect",
        deferFirstDelete: true,
      });
      const vtDeferredAddRectPlugin = createVtRectPlugin({
        type: "vt-deferred-add-rect",
        deferFirstAdd: true,
      });
      const vtStrictRectPlugin = createVtRectPlugin({
        type: "vt-strict-rect",
      });

      const resolveDeferredRectDelete = (elementId) => {
        const id =
          elementId ?? vtDeferredRectDeletes.keys().next().value ?? null;
        const pending = id ? vtDeferredRectDeletes.get(id) : null;
        if (!pending) {
          throw new Error(`No deferred VT rect delete found for ${id}.`);
        }

        vtDeferredRectDeletes.delete(id);
        vtReleasedDeferredRectDeleteIds.add(id);
        try {
          // Deliberately retry the originally captured physical parent first.
          // The replacement lifecycle must retarget cleanup after reparenting.
          rectPlugin.delete(pending.options);
          pending.resolve();
        } catch (error) {
          pending.reject(error);
        }
      };

      const resolveDeferredRectAdd = (elementId) => {
        const id = elementId ?? vtDeferredRectAdds.keys().next().value ?? null;
        const pending = id ? vtDeferredRectAdds.get(id) : null;
        if (!pending) {
          throw new Error(`No deferred VT rect add found for ${id}.`);
        }

        vtDeferredRectAdds.delete(id);
        vtReleasedDeferredRectAddIds.add(id);
        try {
          rectPlugin.add(pending.options);
          markVtRectType(
            pending.options.parent,
            pending.options.element,
            "vt-deferred-add-rect",
          );
          pending.resolve();
        } catch (error) {
          pending.reject(error);
        }
      };

      const plugins = {
        elements: [
          textPlugin,
          rectPlugin,
          vtDeferredRectPlugin,
          vtDeferredAddRectPlugin,
          vtStrictRectPlugin,
          spritePlugin,
          videoPlugin,
          sliderPlugin,
          inputPlugin,
          containerPlugin,
          textRevealingPlugin,
          animatedSpritePlugin,
          particlesPlugin,
        ],
        animations: [tweenPlugin],
        audio: [soundPlugin],
      };
      let index = 0;
      let advanceToNextStateOnRenderComplete = false;
      const vtStateSource =
        document.getElementById("vt-state")?.textContent?.trim() ?? "";
      const vtDocuments = parseAllDocuments(vtStateSource).map(
        (doc) => doc.toJSON() ?? {},
      );
      const vtState = Object.assign({}, ...vtDocuments);
      const states = vtState.states ?? [];
      const useBrowserScreenshot = vtState.useBrowserScreenshot === true;
      const rendererQuery = new URLSearchParams(window.location.search).get(
        "renderer",
      );
      const rendererPreference =
        rendererQuery ?? vtState.rendererPreference ?? "webgl";
      const rendererFallback =
        vtState.rendererFallback ?? rendererPreference === "webgl";
      const elementHasRevealSound = (element) =>
        Boolean(element?.revealSound) ||
        (Array.isArray(element?.children) &&
          element.children.some(elementHasRevealSound));
      const stateHasAudio = (state) =>
        (Array.isArray(state?.audio) && state.audio.length > 0) ||
        (Array.isArray(state?.audioEffects) && state.audioEffects.length > 0) ||
        (Array.isArray(state?.elements) &&
          state.elements.some(elementHasRevealSound));
      const hasAudioStates = states.some(stateHasAudio);
      const audioAssetKeys = Object.entries(assetsObject)
        .filter(([, asset]) => asset?.type?.startsWith?.("audio/"))
        .map(([key]) => key);
      if (hasAudioStates) {
        window.RTGL_AUDIO_DEBUG = true;
        console.log("[VT audio] debug enabled", {
          audioAssetKeys,
          audioStateIds: states
            .filter(stateHasAudio)
            .map((state, stateIndex) => state?.id ?? `state-${stateIndex}`),
        });
      }
      if (!useBrowserScreenshot) {
        let vtScreenshotHookPrimed = false;
        const waitForStableScreenshotFrame = async () => {
          await new Promise((resolve) => {
            requestAnimationFrame(() => {
              requestAnimationFrame(resolve);
            });
          });
        };
        window.takeVtScreenshotBase64 = async () => {
          await waitForStableScreenshotFrame();

          // Pixi extraction can return an empty first frame immediately after mount.
          // Warm the hook once and return the second capture for the first caller.
          if (!vtScreenshotHookPrimed) {
            vtScreenshotHookPrimed = true;
            try {
              await app.extractBase64();
            } catch {}
            await waitForStableScreenshotFrame();
          }

          return await app.extractBase64();
        };
      } else {
        document.documentElement.classList.add("vt-browser-screenshot");
      }
      window.__VT_STATE_DATA__ = vtState;
      window.__VT_STATES__ = states;
      const pager = document.createElement("nav");
      pager.className = "vt-state-pager";
      pager.setAttribute("aria-label", "State navigation");
      const prevButton = document.createElement("button");
      prevButton.className = "vt-state-nav";
      prevButton.type = "button";
      prevButton.setAttribute("aria-label", "Previous state");
      prevButton.textContent = "←";
      const stateCenter = document.createElement("div");
      stateCenter.className = "vt-state-center";
      const stateList = document.createElement("div");
      stateList.className = "vt-state-list";
      const nextButton = document.createElement("button");
      nextButton.className = "vt-state-nav";
      nextButton.type = "button";
      nextButton.setAttribute("aria-label", "Next state");
      nextButton.textContent = "→";

      stateCenter.append(stateList);
      pager.append(prevButton, stateCenter, nextButton);

      window.__VT_EVENTS__ = [];
      window.__VT_ALL_EVENTS__ = [];
      const shouldLogEvents = true;

      const getEventStore = (scope) => {
        if (scope === "all") return window.__VT_ALL_EVENTS__;
        return window.__VT_EVENTS__;
      };

      const clearEvents = () => {
        window.__VT_EVENTS__ = [];
        window.__VT_ALL_EVENTS__ = [];
      };

      window.getVtEvents = (scope = "default") => {
        const store = getEventStore(scope);
        return store.map((event) => ({
          name: event.name,
          payload: event.payload,
        }));
      };

      window.vtAssert = {
        payloadDeepEquals: (eventName, scope = "default") =>
          window
            .getVtEvents(scope)
            .filter((event) => event.name === eventName)
            .map((event) => event.payload),
        pendingDeferredRectDeleteIds: () =>
          Array.from(vtDeferredRectDeletes.keys()).sort(),
        pendingDeferredRectAddIds: () =>
          Array.from(vtDeferredRectAdds.keys()).sort(),
        mountedVtElementType: (elementId) =>
          app.findElementByLabel(elementId)?.__vtElementPluginType ?? null,
        rendererType: () => app.rendererType,
        pluginDispatchMismatches: () =>
          structuredClone(vtPluginDispatchMismatches),
      };
      let vtReadySignaled = false;
      const signalVtReady = async () => {
        if (vtReadySignaled) {
          return;
        }

        vtReadySignaled = true;
        requestAnimationFrame(() => {
          setTimeout(() => {
            window.dispatchEvent(new CustomEvent("vt:ready"));
          }, 0);
        });
      };

      const updatePager = () => {
        const hasMultipleStates = states.length > 1;
        pager.hidden = useBrowserScreenshot || !hasMultipleStates;
        if (!hasMultipleStates) {
          return;
        }

        prevButton.disabled = index <= 0;
        nextButton.disabled = index >= states.length - 1;
        stateList.replaceChildren();

        states.forEach((state, stateIndex) => {
          const stateButton = document.createElement("button");
          stateButton.type = "button";
          stateButton.className = "vt-state-index";
          if (stateIndex === index) {
            stateButton.classList.add("is-active");
            stateButton.setAttribute("aria-current", "true");
          }
          stateButton.textContent = String(stateIndex + 1);
          stateButton.title = state?.id
            ? `State ${stateIndex + 1}: ${state.id}`
            : `State ${stateIndex + 1}`;
          stateButton.addEventListener("click", () => {
            renderState(stateIndex);
          });
          stateList.appendChild(stateButton);
        });
      };

      const renderState = (nextIndex, { doubleRender = false } = {}) => {
        if (nextIndex < 0 || nextIndex >= states.length) {
          return;
        }

        index = nextIndex;
        const state = states[index] ?? {};
        const nextRenderState = {
          id: state.id ?? `state-${index}`,
          elements: state.elements ?? [],
          animations: state.animations ?? [],
          audio: state.audio ?? [],
          audioEffects: state.audioEffects ?? [],
          global: state.global ?? {},
        };

        app.render(nextRenderState);
        if (doubleRender) {
          app.render(nextRenderState);
        }
        updatePager();
      };

      let hasStartedAudioFixtureFromPointer = false;
      const startAudioFixtureFromPointer = (event) => {
        void app.resumeAudio?.();

        if (!hasAudioStates || hasStartedAudioFixtureFromPointer) {
          return;
        }
        if (event.target?.closest?.(".vt-state-pager")) {
          return;
        }
        if (stateHasAudio(states[index])) {
          return;
        }

        const nextAudioStateIndex = states.findIndex(
          (state, stateIndex) => stateIndex > index && stateHasAudio(state),
        );
        if (nextAudioStateIndex === -1) {
          return;
        }

        hasStartedAudioFixtureFromPointer = true;
        renderState(nextAudioStateIndex);
      };

      document.addEventListener("pointerdown", startAudioFixtureFromPointer, {
        capture: true,
      });
      document.addEventListener(
        "keydown",
        () => {
          void app.resumeAudio?.();
        },
        { capture: true },
      );

      await app.init({
        width: 1280,
        height: 720,
        plugins,
        eventHandler: (eventName, payload) => {
          const eventData = {
            name: eventName,
            payload,
          };
          if (shouldLogEvents) {
            console.log("[VT event]", eventName, payload);
          }
          window.__VT_ALL_EVENTS__.push(eventData);
          if (eventName === "renderComplete") {
            if (
              advanceToNextStateOnRenderComplete &&
              payload?.aborted !== true
            ) {
              advanceToNextStateOnRenderComplete = false;
              renderState(index + 1);
            }
            return;
          }
          window.__VT_EVENTS__.push(eventData);
        },
        onFirstRender: () => {
          void signalVtReady();
        },
        debug: window?.RTGL_VT_DEBUG ?? false,
        rendererPreference,
        rendererFallback,
      });
      window.__VT_ROUTE_GRAPHICS__ = app;
      const assetBufferMap = assetBufferManager.getBufferMap();
      if (isVideoVisualTest) {
        await Promise.all(
          ["video-sample", "video-sample-2"].map(async (assetKey) => {
            const asset = assetsObject[assetKey];
            const response = await fetch(asset.url);
            if (!response.ok) {
              throw new Error(
                `Could not load VT video asset "${assetKey}" (HTTP ${response.status}).`,
              );
            }
            assetBufferMap[assetKey] = {
              buffer: await response.arrayBuffer(),
              type: asset.type,
              source: "buffer",
            };
          }),
        );
      }
      await app.loadAssets(assetBufferMap);
      if (hasAudioStates) {
        console.log("[VT audio] assets decoded", { audioAssetKeys });
      }
      document.body.appendChild(app.canvas);
      document.body.appendChild(pager);
      if (states.length > 0) {
        renderState(index, { doubleRender: true });
      } else {
        updatePager();
        signalVtReady();
      }

      prevButton.addEventListener("click", () => {
        renderState(index - 1);
      });

      nextButton.addEventListener("click", () => {
        renderState(index + 1);
      });

      const listenEvents = () => {
        const dispatchVtKeyboardEvent = (type, options) => {
          document.dispatchEvent(
            new KeyboardEvent(type, {
              bubbles: true,
              cancelable: true,
              ...options,
            }),
          );
        };

        document.addEventListener("keydown", async (e) => {
          if (e.shiftKey && e.key !== "Shift") {
            if (states.length > index + 1) {
              renderState(index + 1, { doubleRender: true });
            }
          } else if (e.key === "n" || e.key === "ArrowRight") {
            if (states.length > index + 1) {
              renderState(index + 1);
            }
          } else if (e.key === "b" || e.key === "ArrowLeft") {
            if (index - 1 >= 0) {
              renderState(index - 1);
            }
          }
        });

        window.addEventListener("clearEvents", () => {
          clearEvents();
        });

        window.addEventListener("vtResolveDeferredRectDelete", (event) => {
          resolveDeferredRectDelete(event.detail?.elementId);
        });

        window.addEventListener("vtResolveDeferredRectAdd", (event) => {
          resolveDeferredRectAdd(event.detail?.elementId);
        });

        window.addEventListener("vtKeyboardShiftCReleaseShiftFirst", () => {
          dispatchVtKeyboardEvent("keydown", {
            key: "Shift",
            code: "ShiftLeft",
            keyCode: 16,
            which: 16,
            shiftKey: true,
          });
          dispatchVtKeyboardEvent("keydown", {
            key: "c",
            code: "KeyC",
            keyCode: 67,
            which: 67,
            shiftKey: true,
          });
          dispatchVtKeyboardEvent("keyup", {
            key: "Shift",
            code: "ShiftLeft",
            keyCode: 16,
            which: 16,
          });
          dispatchVtKeyboardEvent("keyup", {
            key: "c",
            code: "KeyC",
            keyCode: 67,
            which: 67,
          });
        });

        window.addEventListener("vtKeyboardNumpad0", () => {
          dispatchVtKeyboardEvent("keydown", {
            key: "0",
            code: "Numpad0",
            keyCode: 96,
            which: 96,
          });
          dispatchVtKeyboardEvent("keyup", {
            key: "0",
            code: "Numpad0",
            keyCode: 96,
            which: 96,
          });
        });

        window.addEventListener("primeVtScreenshot", async () => {
          if (typeof window.takeVtScreenshotBase64 !== "function") {
            return;
          }
          try {
            await window.takeVtScreenshotBase64();
          } catch {}
        });

        window.addEventListener("snapShotVideoFrame", (event) => {
          delete document.documentElement.dataset.vtVideoFrameReady;
          const videoElement = app.findElementByLabel(event.detail?.elementId);
          const source = videoElement?.texture?.source;
          const video = source?.resource;
          if (!(video instanceof HTMLVideoElement)) {
            return;
          }

          video.pause();
          let hasCommittedVideoFrame = false;
          const commitVideoFrame = async () => {
            if (hasCommittedVideoFrame) {
              return;
            }

            if (
              video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
              video.videoWidth <= 0 ||
              video.videoHeight <= 0
            ) {
              requestAnimationFrame(commitVideoFrame);
              return;
            }

            hasCommittedVideoFrame = true;
            video.pause();
            source.__routeGraphicsVideoTextureRuntime?.requestUpdate?.({
              force: true,
            });
            source.update?.();
            try {
              await app.extractBase64();
            } finally {
              document.documentElement.dataset.vtVideoFrameReady =
                event.detail?.elementId ?? "ready";
            }
          };
          const playUntilVideoFrame = () => {
            const requestedTime = Number(event.detail?.time ?? 0);
            const targetTime = Number.isFinite(video.duration)
              ? Math.min(
                  Math.max(0, requestedTime),
                  Math.max(0, video.duration - 0.05),
                )
              : requestedTime;

            const waitForPresentedVideoFrame = () => {
              if (typeof video.requestVideoFrameCallback === "function") {
                video.requestVideoFrameCallback(commitVideoFrame);
              }
              requestAnimationFrame(() => {
                requestAnimationFrame(commitVideoFrame);
              });
            };
            const seekableEnd =
              video.seekable.length > 0
                ? video.seekable.end(video.seekable.length - 1)
                : 0;
            const seekToTargetTime = () => {
              if (Math.abs(video.currentTime - targetTime) < 1 / 120) {
                waitForPresentedVideoFrame();
              } else {
                video.addEventListener("seeked", waitForPresentedVideoFrame, {
                  once: true,
                });
                video.currentTime = targetTime;
              }
            };
            if (video.currentSrc.startsWith("blob:")) {
              if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                seekToTargetTime();
              } else {
                video.addEventListener("loadeddata", seekToTargetTime, {
                  once: true,
                });
              }
              return;
            }
            if (seekableEnd + 1 / 120 >= targetTime) {
              seekToTargetTime();
              return;
            }

            if (typeof video.requestVideoFrameCallback === "function") {
              const captureAtTargetTime = (_now, metadata) => {
                if (metadata.mediaTime + 1 / 120 < targetTime && !video.ended) {
                  video.requestVideoFrameCallback(captureAtTargetTime);
                  return;
                }
                commitVideoFrame();
              };
              video.requestVideoFrameCallback(captureAtTargetTime);
            } else {
              const captureAtTargetTime = () => {
                if (video.currentTime + 1 / 120 < targetTime && !video.ended) {
                  return;
                }
                video.removeEventListener("timeupdate", captureAtTargetTime);
                commitVideoFrame();
              };
              video.addEventListener("timeupdate", captureAtTargetTime);
            }

            video.muted = true;
            void video.play().catch(commitVideoFrame);
          };

          if (video.readyState === 0) {
            video.addEventListener("loadedmetadata", playUntilVideoFrame, {
              once: true,
            });
          } else {
            playUntilVideoFrame();
          }
        });

        window.addEventListener("vtNextState", () => {
          if (states.length > index + 1) {
            renderState(index + 1);
          }
        });

        window.addEventListener("vtNextStateOnRenderComplete", () => {
          advanceToNextStateOnRenderComplete = true;
        });

        window.addEventListener("vtPrevState", () => {
          if (index - 1 >= 0) {
            renderState(index - 1);
          }
        });
      };
      listenEvents();
    </script>
    <link rel="stylesheet" href="/public/theme.css" />
  </head>
  <body></body>
</html>
