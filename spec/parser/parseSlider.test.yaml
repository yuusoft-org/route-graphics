file: ../../src/plugins/elements/slider/parseSlider.js
group: parser
suites:
  - parseSlider
---
suite: parseSlider
exportName: parseSlider
---
case: Test parsing slider with all properties
in:
  - state:
      id: volume-slider
      type: slider
      barSrc: file:slider-bar
      inactiveBarSrc: file:slider-track
      thumbSrc: file:slider-thumb
      direction: horizontal
      alpha: 0.8
      width: 80
      height: 100
      min: 10
      max: 200
      step: 5
      initialValue: 50
      scaleX: 1.2
      scaleY: 0.8
      x: 240
      "y": 240
      anchorX: 0.5
      anchorY: 0.5
      hover:
        thumbSrc: file:thumb-hover
        barSrc: file:bar-hover
        inactiveBarSrc: file:track-hover
        soundSrc: sound-1
        soundVolume: 85
        cursor: cursor-1
        payload:
          prop1: "44"
          prop2: "55"
      change:
        payload:
          volume: 33
out:
  id: volume-slider
  type: slider
  width: 96
  height: 80
  x: 192
  "y": 200
  originX: 48
  originY: 40
  scaleX: 1.2
  scaleY: 0.8
  rotation: 0
  alpha: 0.8
  barSrc: file:slider-bar
  inactiveBarSrc: file:slider-track
  thumbSrc: file:slider-thumb
  direction: horizontal
  min: 10
  max: 200
  step: 5
  initialValue: 50
  hover:
    thumbSrc: file:thumb-hover
    barSrc: file:bar-hover
    inactiveBarSrc: file:track-hover
    soundSrc: sound-1
    soundVolume: 85
    cursor: cursor-1
    payload:
      prop1: "44"
      prop2: "55"
  change:
    payload:
      volume: 33
---
case: Test parsing slider throws when min is larger than max
in:
  - state:
      id: error-slider
      type: slider
      barSrc: file:slider-bar
      thumbSrc: file:slider-thumb
      direction: horizontal
      width: 100
      height: 10
      x: 100
      "y": 100
      min: 150
      max: 100
throws: "Input error: the max value of a slider must be larger than the min value"
---
case: Test parsing slider throws when min equals max
in:
  - state:
      id: error-slider
      type: slider
      barSrc: file:slider-bar
      thumbSrc: file:slider-thumb
      direction: horizontal
      width: 100
      height: 10
      x: 100
      "y": 100
      min: 100
      max: 100
throws: "Input error: the max value of a slider must be larger than the min value"
---
