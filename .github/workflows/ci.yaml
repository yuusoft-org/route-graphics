name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build:all
      - run: bun run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/
            vt/static/RouteGraphics.js*
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, audio, browser, visual, webgpu]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: .
      - name: Install Chromium
        if: matrix.suite != 'visual'
        run: bunx playwright install --with-deps chromium
      - name: Unit and CLI tests
        if: matrix.suite == 'unit'
        env:
          VITEST_MAX_WORKERS: 2
        run: bun run test
      - name: Deterministic audio rendering
        if: matrix.suite == 'audio'
        run: node scripts/audioVisualTest.mjs report
      - name: Browser integration
        if: matrix.suite == 'browser'
        run: |
          node scripts/testRuntimeLifecycle.mjs
          node scripts/testVideoPlayback.mjs
          node scripts/testLayoutReport.mjs
      - name: WebGPU integration
        if: matrix.suite == 'webgpu'
        run: node scripts/testWebGPUShaders.mjs
      - name: Visual regression
        if: matrix.suite == 'visual'
        env:
          RTGL_VT_DEBUG: true
          RTGL_VT_CONCURRENCY: 4
        run: bun run vt:report:built
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failures-${{ matrix.suite }}-${{ github.run_number }}
          path: |
            avt/output/
            .rettangoli/
          include-hidden-files: true
          retention-days: 14
