title: Delayed enter automation
description: Verifies keyframe delay, volume fade, and simultaneous pan automation.
durationMs: 3250
sampleRate: 48000
numberOfChannels: 2
assets:
  tone440:
    generator: tone
    frequency: 440
states:
  - atMs: 0
    state:
      id: enter-delay-pan
      elements: []
      animations: []
      audio:
        - id: tone
          type: sound
          src: tone440
          loop: true
          volume: 90
          pan: 0.8
      audioEffects:
        - id: tone-enter:1
          type: audio-transition
          targetId: tone
          properties:
            volume:
              enter:
                initialValue: 0
                keyframes:
                  - delay: 400
                    value: 90
                    duration: 600
                    easing: linear
            pan:
              enter:
                initialValue: -0.8
                keyframes:
                  - value: 0.8
                    duration: 1000
                    easing: linear
