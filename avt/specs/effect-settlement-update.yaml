title: Active retained update settlement
description: Verifies effect removal cancels a retained volume ramp and settles to declarative volume.
durationMs: 3000
sampleRate: 48000
numberOfChannels: 2
assets:
  tone440:
    generator: tone
    frequency: 440
states:
  - atMs: 0
    state:
      id: update-settlement-before
      elements: []
      animations: []
      audio:
        - id: tone
          type: sound
          src: tone440
          loop: true
          volume: 100
  - atMs: 500
    state:
      id: update-settlement-active
      elements: []
      animations: []
      audio:
        - id: tone
          type: sound
          src: tone440
          loop: true
          volume: 20
      audioEffects:
        - id: tone-update:1
          type: audio-transition
          targetId: tone
          properties:
            volume:
              update:
                keyframes:
                  - value: 20
                    duration: 2000
                    easing: linear
  - atMs: 1000
    state:
      id: update-settlement-removed
      elements: []
      animations: []
      audio:
        - id: tone
          type: sound
          src: tone440
          loop: true
          volume: 20
      audioEffects: []
