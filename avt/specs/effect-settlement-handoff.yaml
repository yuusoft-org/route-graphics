title: Active handoff settlement
description: Verifies effect removal cleans the outgoing source and settles the incoming source.
durationMs: 3000
sampleRate: 48000
numberOfChannels: 2
assets:
  tone440:
    generator: tone
    frequency: 440
  tone880:
    generator: tone
    frequency: 880
states:
  - atMs: 0
    state:
      id: handoff-settlement-before
      elements: []
      animations: []
      audio:
        - id: bgm
          type: sound
          src: tone440
          loop: true
          volume: 80
  - atMs: 500
    state:
      id: handoff-settlement-active
      elements: []
      animations: []
      audio:
        - id: bgm
          type: sound
          src: tone880
          loop: true
          volume: 80
      audioEffects:
        - id: bgm-handoff:1
          type: audio-transition
          targetId: bgm
          properties:
            volume:
              exit:
                keyframes:
                  - value: 0
                    duration: 2000
                    easing: linear
              enter:
                initialValue: 0
                keyframes:
                  - value: 80
                    duration: 2000
                    easing: linear
  - atMs: 1000
    state:
      id: handoff-settlement-removed
      elements: []
      animations: []
      audio:
        - id: bgm
          type: sound
          src: tone880
          loop: true
          volume: 80
      audioEffects: []
