title: Master volume during active sound fade
description: Verifies a channel master change scales but does not restart a child sound envelope.
durationMs: 4000
sampleRate: 48000
numberOfChannels: 2
assets:
  tone440:
    generator: tone
    frequency: 440
states:
  - atMs: 0
    state:
      id: master-volume-fade
      elements: []
      animations: []
      audio:
        - id: music
          type: audio-channel
          volume: 80
          children:
            - id: tone
              type: sound
              src: tone440
              loop: true
              volume: 100
      audioEffects:
        - id: tone-enter:1
          type: audio-transition
          targetId: tone
          properties:
            volume:
              enter:
                initialValue: 0
                keyframes:
                  - value: 100
                    duration: 3000
                    easing: linear
  - atMs: 1000
    state:
      id: master-volume-changed
      elements: []
      animations: []
      audio:
        - id: music
          type: audio-channel
          volume: 40
          children:
            - id: tone
              type: sound
              src: tone440
              loop: true
              volume: 100
      audioEffects:
        - id: tone-enter:1
          type: audio-transition
          targetId: tone
          properties:
            volume:
              enter:
                initialValue: 0
                keyframes:
                  - value: 100
                    duration: 3000
                    easing: linear
